[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surge"
version = "1.0.0"
description = "Surge 跨境电商 AI 内容工作台：竞品分析与 Listing 生成"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "openpyxl>=3.1,<4.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-postgres>=3.2,<4.0",
    "langchain-anthropic>=1.7,<2.0",
    "langchain-google-genai>=3.0,<5.0",
    "psycopg[binary]>=3.2",
    "psycopg_pool>=3.2,<4.0",
    "openai>=1.40",
]

[project.optional-dependencies]
queue = ["arq>=0.26,<1.0", "redis>=5.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
surge = "surge.cli:main"

[tool.setuptools.package-data]
# 目录式技能：SKILL.md 与产出结构必须随包发布，否则 wheel 里没有技能
surge = ["skills/catalog/*/SKILL.md", "skills/catalog/*/*.json"]

[tool.setuptools.packages.find]
# 包布局：backend/ 是工程根，surge/ 是唯一的顶级包，
# 其下按业务域拆分子包（目录职责见 surge/__init__.py 的 docstring）。
include = ["surge*"]

# tests / scripts / config 不进入 wheel：
#   config/ 是纯数据目录（无 __init__.py），不能列为包——那会让
#   `import config` 解析到目录而不是 surge/config.py；
#   源码部署（Render / 本地）直接读 backend/config/。

[tool.pytest.ini_options]
testpaths = ["tests"]
