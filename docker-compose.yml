services:
  postgres:
    image: postgres:16-alpine
    container_name: cp-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crosspilot
    ports:
      - "5432:5432"
    volumes:
      - cp-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crosspilot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cp-pg-data:
    name: cp-pg-data
